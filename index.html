<body>
        <h1>heat index checker</h1>

        <button class="btn btn-success" onclick="heatindex()">Check</button>

        <label>Temperature:</label>
     <input type="number" id="temp" class="form-control w-25 mb-2">

         <label>Humidity:</label>
     <input type="number" id="humid" class="form-control w-25 mb-3"> 
   
   <script>
        
        function heatindex(){
            let temp, humidity, HI, status = 0;
            temp = parseFloat (document.getElementById("temp").value);
            humidity = parseFloat (document.getElementById("humid").value);
       
            HI = temp + (0.33 * humidity) - 4;
    
        status = ""; //initialize empty value
        

        switch(true){
        case (temp >= 20 && temp <= 24 && humidity >= 30 && humidity <= 50):
            alert("Comfortable / Cool");
            break;

        case (temp >= 25 && temp <= 27 && humidity >= 40 && humidity <= 60 ):
            alert("Warm");
            break;

        case (temp >= 28 && temp <= 31 && humidity >= 50 && humidity <= 70 ):
            alert("Hot");
            break;

        case (temp >= 32 && temp <= 35 && humidity >= 60 && humidity <= 80):
            alert("Very Hot / Caution");
            break;

        case (temp >= 36 && humidity >= 70):
            alert("Extreme Heat / Danger");
            break;

        default:
            alert("Heat Index is outside defined range");

    </script>
